# 노트북 생존 감시: 매일 07:30(한국 시간) heartbeat.json 이 오늘 날짜인지 확인하고, 아니면 텔레그램 경고
name: watchdog
on:
  schedule:
    - cron: "30 22 * * *"   # UTC 22:30 = 한국 07:30
  workflow_dispatch:         # 수동 시험 실행용
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check heartbeat
        env:
          TOKEN_RAW: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_RAW: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOKEN=$(printf %s "$TOKEN_RAW" | tr -d '[:space:]' | sed 's/^TELEGRAM_BOT_TOKEN=//')
          CHAT=$(printf %s "$CHAT_RAW" | tr -d '[:space:]' | sed 's/^TELEGRAM_CHAT_ID=//')
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then echo "비밀값(TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID)이 비어 있음"; exit 1; fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          LAST=$(python3 -c "import json;print(json.load(open('heartbeat.json'))['date'])" 2>/dev/null || echo none)
          echo "today=$TODAY last=$LAST"
          if [ "$LAST" != "$TODAY" ]; then
            MSG=$(printf '🚨 노트북 작업 미확인 (%s)\n오늘 아침 점검 신호가 오지 않았습니다 (마지막 신호: %s).\n노트북 전원·절전·Claude Desktop 실행 여부를 확인해 주세요.' "$TODAY" "$LAST")
            CODE=$(curl -sS -o resp.json -w "%{http_code}" "https://api.telegram.org/bot${TOKEN}/sendMessage" \
                   --data-urlencode "chat_id=${CHAT}" --data-urlencode "text=${MSG}")
            echo "telegram http=$CODE"
            python3 -c "import json;r=json.load(open('resp.json'));print('ok' if r.get('ok') else r.get('description'))"
            [ "$CODE" = "200" ] || exit 1
          else
            echo "오늘 신호 정상 - 경고 없음"
          fi
